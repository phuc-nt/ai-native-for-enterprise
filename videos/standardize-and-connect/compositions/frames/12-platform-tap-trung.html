  <div id="root" data-composition-id="12-platform-tap-trung" data-width="1920" data-height="1080" data-start="0" data-duration="15.26">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var IN = "power3.out";

      // ---------- Scene 1 (0.0–3.1): header, h2, "năm phần" label ----------
      tl.fromTo("#f12-eyebrow", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, 0);
      tl.fromTo("#f12-pill", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, 0.05);
      tl.fromTo("#f12-progress", { scaleX: 11 / 12 }, { scaleX: 1, duration: 0.6, ease: IN }, 0.1);
      tl.fromTo("#f12-h2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0.2);

      // empty monolith region (five ghost slots), established bottom-up
      tl.fromTo(["#f12-g1", "#f12-g2", "#f12-g3", "#f12-g4", "#f12-g5"],
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: IN, stagger: 0.06 }, 0.25);

      // "năm phần" (2.1)
      tl.fromTo("#f12-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, 2.1);

      // ---------- Scene 2 (3.1–9.2): tiers build bottom-up on cue ----------
      var tiers = [
        ["#f12-t1", "#f12-g1", 3.1],
        ["#f12-t2", "#f12-g2", 4.2],
        ["#f12-t3", "#f12-g3", 6.2],
        ["#f12-t4", "#f12-g4", 7.3],
        ["#f12-t5", "#f12-g5", 8.5]
      ];
      tiers.forEach(function (t) {
        tl.fromTo(t[0], { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, t[2]);
        tl.to(t[1], { opacity: 0, duration: 0.3, ease: "power1.out" }, t[2] + 0.3);
      });

      // slow camera push-in under the build, resting before the fuse
      tl.fromTo("#f12-stage", { scale: 1 }, { scale: 1.015, duration: 8.2, ease: "sine.inOut" }, 3.1);

      // ---------- Scene 3 (9.2–11.3): motives column ----------
      tl.fromTo("#f12-conn-h", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: IN }, 9.2);
      tl.fromTo("#f12-conn-v", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.45, ease: IN }, 9.35);
      tl.fromTo("#f12-mot-title", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: IN }, 9.2);
      tl.fromTo(["#f12-m1", "#f12-m2", "#f12-m3"],
        { opacity: 0, x: 24 },
        { opacity: 1, x: 0, duration: 0.55, ease: IN, stagger: 0.3 }, 9.45);

      // ---------- Scene 4 (11.3–15.26): dim, fuse, outline ----------
      // de-emphasise the motives column (text to muted gray keeps contrast; chrome to ~45%)
      tl.to(["#f12-mot-title", ".f12-mot-text"], { color: "#6b6b6b", duration: 0.5, ease: "power2.out" }, 11.3);
      tl.to([".f12-mot-dot", "#f12-conn-h", "#f12-conn-v"], { opacity: 0.45, duration: 0.5, ease: "power2.out" }, 11.3);
      tl.to(".f12-mot", { borderColor: "rgba(30,43,250,0.09)", backgroundColor: "rgba(30,43,250,0.018)", duration: 0.5, ease: "power2.out" }, 11.3);

      // "gộp" (12.1): gaps close to zero around the middle tier
      tl.to("#f12-t5", { y: 32, duration: 0.7, ease: "power3.inOut" }, 12.1);
      tl.to("#f12-t4", { y: 16, duration: 0.7, ease: "power3.inOut" }, 12.1);
      tl.to("#f12-t2", { y: -16, duration: 0.7, ease: "power3.inOut" }, 12.1);
      tl.to("#f12-t1", { y: -32, duration: 0.7, ease: "power3.inOut" }, 12.1);
      // separate tier cards dissolve into one continuous block
      tl.to(".f12-tier-bg", { opacity: 0, duration: 0.35, ease: "power1.inOut" }, 12.55);
      tl.fromTo("#f12-fused", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.inOut" }, 12.55);

      // "một khối" (14.1): cobalt 3px outer outline draws around the block
      tl.fromTo("#f12-outline-rect", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 14.1);
      tl.fromTo("#f12-verdict", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.55, ease: IN }, 14.25);

      // hold still to the end
      tl.set({}, {}, 15.26);

      window.__timelines["12-platform-tap-trung"] = tl;
    })();
  </script>
