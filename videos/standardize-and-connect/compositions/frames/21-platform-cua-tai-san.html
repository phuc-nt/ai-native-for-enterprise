    <style>

      #root {

      .f21-count {

      /* ---------- left half: the three-tier pedestal (supporting) ---------- */
      .f21-label {
        position: absolute;
        left: 96px;
        top: 360px;
        margin: 0;
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 26px;
        line-height: 1.35;
        color: #6b6b6b;
      }

      .f21-frame {
        position: absolute;
        left: 68px;
        top: 432px;
        width: 776px;
        height: 420px;
        overflow: visible;
      }

      .f21-frame rect {
        fill: none;
        stroke: rgba(30, 43, 250, 0.45);
        stroke-width: 1.5;
        stroke-dasharray: 2360;
        stroke-dashoffset: 2360;
      }

      .f21-frame-tag {
        position: absolute;

        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: 28px;

      .f21-tier {

        align-items: center;

      .f21-tier-data { left: 96px;  top: 712px; width: 720px; }
      .f21-tier-kit  { left: 136px; top: 588px; width: 640px; }
      .f21-tier-gov  { left: 176px; top: 464px; width: 560px; }

      .f21-tier-name {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: 36px;
        line-height: 1.2;
        letter-spacing: -0.01em;
        color: #111111;
      }

      /* ---------- right half: hero sentence (foreground subject) ---------- */
      .f21-hero {
        position: absolute;
        left: 1000px;
        top: 402px;
        width: 824px;
      }

      .f21-line1 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 104px;
        line-height: 1.12;
        letter-spacing: -0.02em;
        color: #111111;
      }

      .f21-line2 {
        margin: 44px 0 0 0;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 500;
        font-size: 52px;
        line-height: 1.25;
        letter-spacing: -0.01em;
        color: #6b6b6b;
      }

      .f21-w {
        display: inline-block;
      }

      .f21-asset {
        color: #111111;
      }

      .f21-strikewrap {
        position: relative;
        display: inline-block;
      }

      .f21-strike {
        position: absolute;
        left: -6px;
        right: -6px;
        top: 58%;
        height: 3px;
        margin-top: -1.5px;
        border-radius: 2px;
        background: #6b6b6b;
        transform-origin: 0% 50%;
      }

      /* ---------- progress bar (chrome, the one bottom-edge exception) ---------- */
      .f21-progress {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 1680px;
        height: 3px;
        background: #1e2bfa;
        transform-origin: 0% 50%;
      }
    </style>

    <div class="clip f21-bg" data-start="0" data-duration="13.7" data-track-index="0"></div>

    <div class="clip f21-stage" data-start="0" data-duration="13.7" data-track-index="1">
      <p class="f21-eyebrow" id="f21-eyebrow">Lập luận</p>
      <div class="f21-count" id="f21-count">21 / 24</div>

      <p class="f21-label" id="f21-label">Phần cần xây tập trung</p>

      <svg class="f21-frame" id="f21-frame" viewBox="0 0 776 420" width="776" height="420">
        <rect x="0.75" y="0.75" width="774.5" height="418.5" rx="16" ry="16"></rect>
      </svg>
      <div class="f21-frame-tag" id="f21-frame-tag">platform</div>

      <div class="f21-tier f21-tier-gov" id="f21-tier-gov"><span class="f21-tier-name">Governance layer</span></div>
      <div class="f21-tier f21-tier-kit" id="f21-tier-kit"><span class="f21-tier-name">Kit registry</span></div>
      <div class="f21-tier f21-tier-data" id="f21-tier-data"><span class="f21-tier-name">Data layer</span></div>

      <div class="f21-hero" id="f21-hero">
        <p class="f21-line1" id="f21-line1"><span class="f21-w">Platform</span><br><span class="f21-w">của</span> <span class="f21-asset" id="f21-asset"><span class="f21-w">tài</span> <span class="f21-w">sản</span></span><span class="f21-w">,</span></p>
        <p class="f21-line2" id="f21-line2"><span class="f21-w">không</span> <span class="f21-w">phải</span> <span class="f21-w">platform</span><br><span class="f21-strikewrap"><span class="f21-w">của</span> <span class="f21-w">harness</span><span class="f21-strike" id="f21-strike"></span></span><span class="f21-w">.</span></p>
      </div>

      <div class="f21-progress" id="f21-progress"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

        var enter = { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" };

        /* Scene 1 (0.0–2.9s): header enters; small label on "cần xây" (1.1) */
        tl.fromTo("#f21-eyebrow", { opacity: 0, y: 16 }, Object.assign({}, enter, { duration: 0.5 }), 0.0);
        tl.fromTo("#f21-count", { opacity: 0, y: 16 }, Object.assign({}, enter, { duration: 0.5 }), 0.05);
        tl.fromTo("#f21-progress", { scaleX: 20 / 21 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.1);
        tl.fromTo("#f21-label", { opacity: 0, y: 16 }, enter, 1.1);

        /* Scene 2 (2.9–6.6s): three tiers build bottom-up on their cues */
        tl.fromTo("#f21-tier-data", { opacity: 0, y: 28 }, Object.assign({}, enter, { duration: 0.7 }), 2.9);
        tl.fromTo("#f21-tier-kit", { opacity: 0, y: 28 }, Object.assign({}, enter, { duration: 0.7 }), 3.8);
        tl.fromTo("#f21-tier-gov", { opacity: 0, y: 28 }, Object.assign({}, enter, { duration: 0.7 }), 5.2);

        /* Scene 3 (6.6–10.4s): on "vẫn là một platform" (6.9) a thin frame draws around the tiers + "platform" tag */
        tl.fromTo("#f21-frame rect", { strokeDashoffset: 2360 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 6.9);
        tl.fromTo("#f21-frame-tag", { opacity: 0, y: 12 }, Object.assign({}, enter, { duration: 0.5 }), 7.25);

        /* on "platform của tài sản" (8.9): hero line 1 builds word by word; the pedestal steps back */
        qa("#f21-line1 .f21-w").forEach(function (el, i) {
          tl.fromTo(el, { opacity: 0, y: 28 }, enter, 8.9 + i * 0.1);
        });
        tl.fromTo(["#f21-tier-data", "#f21-tier-kit", "#f21-tier-gov", "#f21-label"], { opacity: 1 },
          { opacity: 0.72, duration: 0.5, ease: "power2.out", immediateRender: false }, 9.0);

        /* "tài sản" turns cobalt (9.5) — the frame's single cobalt moment */
        tl.fromTo("#f21-asset", { color: "#111111" }, { color: "#1e2bfa", duration: 0.4, ease: "power2.out" }, 9.5);

        /* Scene 4 (10.4–13.2s): on "không phải" (10.4) muted line 2 builds; "của harness" struck thin (11.4) */
        qa("#f21-line2 .f21-w").forEach(function (el, i) {
          tl.fromTo(el, { opacity: 0, y: 20 }, Object.assign({}, enter, { duration: 0.5 }), 10.4 + i * 0.09);
        });
        tl.fromTo("#f21-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 11.4);

        /* hold still to the end */
        tl.set({}, {}, 13.2);
        window.__timelines["21-platform-cua-tai-san"] = tl;
      })();
    </script>
  </div>
</template>
